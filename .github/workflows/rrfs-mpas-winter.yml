name: RRFS-MPAS Winter | All Available Forecast Hours

# First use Actions > Run workflow manually. Once a test upload succeeds,
# uncomment the schedule below for incremental processing of new FHRs.
on:
  workflow_dispatch:
    inputs:
      cycle:
        description: 'AUTO = newest cycle; RECENT = backfill up to 8 cycles; or YYYYMMDDHH'
        required: true
        default: 'AUTO'
        type: string
      forecast_hours:
        description: 'ALL, 006, 000-048, or 000,003,006'
        required: true
        default: 'ALL'
        type: string
      domains:
        description: 'lbf,regional,central_plains (comma separated)'
        required: true
        default: 'lbf'
        type: string
      max_hours:
        description: 'Maximum forecast hours to process per run (0 = ALL without limit)'
        required: true
        default: '6'
        type: string
      publish:
        description: 'Publish completed graphics to AWS S3 (off for initial test)'
        required: true
        default: false
        type: boolean
  # IMPORTANT: enable only after successfully publishing a test run.
  # schedule:
  #   - cron: '25 * * * *'

permissions:
  contents: read
concurrency:
  group: rrfs-mpas-winter-site-publisher
  cancel-in-progress: false

jobs:
  winter:
    name: Discover and render available RRFS-MPAS forecast hours
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: '1'
      # Avoid runner.temp here: runner context is unavailable in jobs.<job_id>.env.
      MPAS_OUT_DIR: ${{ github.workspace }}/rrfs_mpas_winter_output
      MPAS_ASSET_DIR: ${{ github.workspace }}/assets
      MPAS_FETCH_ROADS: '1'
      MPAS_REQUIRE_MAP_ASSETS: ${{ (inputs.publish == true || github.event_name == 'schedule') && '1' || '0' }}
      GSL_FTP_EMAIL: ${{ secrets.GSL_FTP_EMAIL }}
      AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Checkout winter website + plotting code
        uses: actions/checkout@v4

      - name: Checkout existing severe CAMs map assets (read-only)
        uses: actions/checkout@v4
        with:
          repository: matthewlabenznws/nwslbf-severewx-model-viewer
          ref: main
          path: severe_assets
          sparse-checkout: |
            assets

      - name: Stage map assets for winter plotter
        shell: bash
        run: |
          python - <<'PYASSETS'
          from pathlib import Path
          from shutil import copy2
          src = Path('severe_assets/assets')
          dest = Path('assets')
          dest.mkdir(exist_ok=True)
          if not src.is_dir():
              raise FileNotFoundError(f'Missing CAMs asset folder: {src}')
          names = {'NOAANWSLogos.png', 'c_18mr25', 'w_16ap26',
                   'cb_2018_us_county_500k', 'cb_2018_us_state_500k',
                   'tl_2023_us_primaryroads'}
          extensions = {'.zip', '.shp', '.shx', '.dbf', '.prj', '.cpg', '.png'}
          found = []
          for file in src.rglob('*'):
              if (file.is_file() and file.suffix.lower() in extensions and
                  (file.name in names or file.stem in names)):
                  copy2(file, dest / file.name)
                  found.append(file.name)
          print('Staged CAMs assets:', ', '.join(sorted(found)) or 'none')
          PYASSETS

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install meteorology plotting dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-winter.txt

      - name: Discover FTP inventory and render available forecast hours
        shell: bash
        env:
          CYCLE_ARG: ${{ inputs.cycle || 'RECENT' }}
          HOURS_ARG: ${{ inputs.forecast_hours || 'ALL' }}
          DOMAINS_ARG: ${{ inputs.domains || 'lbf,regional,central_plains' }}
          MAX_HOURS_ARG: ${{ inputs.max_hours || '6' }}
          PUBLISH_ARG: ${{ (inputs.publish == true || github.event_name == 'schedule') && 'true' || 'false' }}
        run: |
          cmd=(python scripts/process_available_hours.py
               --cycle "$CYCLE_ARG"
               --hours "$HOURS_ARG"
               --domains "$DOMAINS_ARG"
               --max-hours "$MAX_HOURS_ARG"
               --keep-going)
          if [[ "$PUBLISH_ARG" == 'true' ]]; then
            cmd+=(--skip-published)
          fi
          "${cmd[@]}"

      - name: Validate staged PNGs and forecast manifests
        shell: bash
        run: |
          root="$MPAS_OUT_DIR/site_export/runs/cams/rrfs_mpas/winter"
          if [[ -d "$root" ]] && find "$root" -name 'manifest_f*.json' -print -quit | grep -q .; then
            python scripts/publish_rrfs_mpas_winter.py --stage "$MPAS_OUT_DIR/site_export" --dry-run
          else
            echo 'No new forecast hours to stage; either all already published or no new GSL files.'
          fi

      - name: Publish newly generated hours and merge runs.json into S3
        if: ${{ inputs.publish == true || github.event_name == 'schedule' }}
        shell: bash
        run: |
          root="$MPAS_OUT_DIR/site_export/runs/cams/rrfs_mpas/winter"
          if [[ -d "$root" ]] && find "$root" -name 'manifest_f*.json' -print -quit | grep -q .; then
            python scripts/publish_rrfs_mpas_winter.py --stage "$MPAS_OUT_DIR/site_export"
          else
            echo 'No unpublished hours found. S3 index unchanged.'
          fi

      - name: Attach test plots and manifests (manual dry run only)
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.publish == false }}
        uses: actions/upload-artifact@v4
        with:
          name: rrfs-mpas-winter-hourly-preview
          path: ${{ runner.temp }}/rrfs_mpas_winter_output/site_export/runs/cams/rrfs_mpas/winter/
          if-no-files-found: warn
          retention-days: 2
