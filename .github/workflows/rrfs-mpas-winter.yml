name: RRFS-MPAS Winter | All Available Forecast Hours

# Default produces LBF, Regional, and Central Plains per selected FHR.
# Rebuild existing hours to backfill newly introduced wind-speed PNGs on S3.
# The workflow serializes runs.json updates; no running job is cancelled.
# cron-job.org hourly dispatch prioritizes unfinished 00Z/12Z hours, checkpointing in S3.
# Automation runs under a wall-clock budget rather than truncating at F006.
# The runner filters FTP cycles to 00/03/06/09/12/15/18/21Z only.
on:
  workflow_dispatch:
    inputs:
      cycle:
        description: 'PRIORITY = unfinished 00Z/12Z first + shorter runs; AUTO, RECENT, or YYYYMMDDHH'
        required: true
        default: 'PRIORITY'
        type: string
      forecast_hours:
        description: 'ALL, 006, 000-048, or 000,003,006'
        required: true
        default: 'ALL'
        type: string
      domains:
        description: 'All three by default: lbf,regional,central_plains (comma separated)'
        required: true
        default: 'lbf,regional,central_plains'
        type: string
      max_hours:
        description: 'Max forecast-hour count (0 = unlimited, time budget applies)'
        required: true
        default: '0'
        type: string
      publish:
        description: 'Publish each completed forecast hour to AWS S3'
        required: true
        default: true
        type: boolean
      time_budget_minutes:
        description: 'Minutes to run before checkpointing (240 recommended; 330-minute job cap)'
        required: true
        default: '240'
        type: string
      rebuild_existing_hours:
        description: 'When publishing, re-render hours even if their domains are already in S3 (use to repair missing QPF)'
        required: true
        default: false
        type: boolean
  # No GitHub schedule: cron-job.org POSTs to workflow_dispatch hourly at :25 UTC.
  # Keep only one automatic trigger to avoid duplicate runs.

permissions:
  contents: read
concurrency:
  # Serialize S3 manifest + runs.json merges to avoid lost hours from concurrent writes.
  # GitHub can replace *pending* workflow_dispatch triggers, but each started job re-reads S3
  # and the FTP inventory, so pending backlog is recovered on a later run.
  group: rrfs-mpas-winter-site-publisher
  cancel-in-progress: false

jobs:
  winter:
    name: Discover and render available RRFS-MPAS forecast hours
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: '1'
      # Avoid runner.temp here: runner context is unavailable in jobs.<job_id>.env.
      MPAS_OUT_DIR: ${{ github.workspace }}/rrfs_mpas_winter_output
      MPAS_ASSET_DIR: ${{ github.workspace }}/assets
      MPAS_FETCH_ROADS: '1'
      MPAS_REQUIRE_MAP_ASSETS: ${{ inputs.publish == true && '1' || '0' }}
      GSL_FTP_EMAIL: ${{ secrets.GSL_FTP_EMAIL }}
      AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Checkout winter website + plotting code
        uses: actions/checkout@v4

      - name: Checkout existing severe CAMs map assets (read-only)
        uses: actions/checkout@v4
        with:
          repository: matthewlabenznws/nwslbf-severewx-model-viewer
          ref: main
          path: severe_assets
          sparse-checkout: |
            assets

      - name: Stage map assets for winter plotter
        shell: bash
        run: |
          python - <<'PYASSETS'
          from pathlib import Path
          from shutil import copy2
          src = Path('severe_assets/assets')
          dest = Path('assets')
          dest.mkdir(exist_ok=True)
          if not src.is_dir():
              raise FileNotFoundError(f'Missing CAMs asset folder: {src}')
          names = {'NOAANWSLogos.png', 'c_18mr25', 'w_16ap26',
                   'cb_2018_us_county_500k', 'cb_2018_us_state_500k',
                   'tl_2023_us_primaryroads'}
          extensions = {'.zip', '.shp', '.shx', '.dbf', '.prj', '.cpg', '.png'}
          found = []
          for file in src.rglob('*'):
              if (file.is_file() and file.suffix.lower() in extensions and
                  (file.name in names or file.stem in names)):
                  copy2(file, dest / file.name)
                  found.append(file.name)
          print('Staged CAMs assets:', ', '.join(sorted(found)) or 'none')
          PYASSETS

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install meteorology plotting dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-winter.txt

      - name: Prioritize 00Z/12Z backlog and publish each available forecast hour
        shell: bash
        env:
          CYCLE_ARG: ${{ inputs.cycle || 'PRIORITY' }}
          HOURS_ARG: ${{ inputs.forecast_hours || 'ALL' }}
          DOMAINS_ARG: ${{ inputs.domains || 'lbf,regional,central_plains' }}
          MAX_HOURS_ARG: ${{ inputs.max_hours || '0' }}
          TIME_BUDGET_ARG: ${{ inputs.time_budget_minutes || '240' }}
          PUBLISH_ARG: ${{ inputs.publish == true && 'true' || 'false' }}
          REBUILD_ARG: ${{ inputs.rebuild_existing_hours && 'true' || 'false' }}
        run: |
          cmd=(python scripts/process_available_hours.py
               --cycle "$CYCLE_ARG"
               --hours "$HOURS_ARG"
               --domains "$DOMAINS_ARG"
               --max-hours "$MAX_HOURS_ARG"
               --max-wall-minutes "$TIME_BUDGET_ARG"
               --lookback-hours 96
               --keep-going)
          # Rebuild can repair QPF missing from previously-published hours.
          # A dry-run always plots requested hours, regardless of S3 contents.
          if [[ "$PUBLISH_ARG" == 'true' && "$REBUILD_ARG" != 'true' ]]; then
            cmd+=(--skip-published)
          fi
          # Upload each FHR immediately, before processing the next FHR.
          if [[ "$PUBLISH_ARG" == 'true' ]]; then
            cmd+=(--publish-each-hour)
          fi
          "${cmd[@]}"

      - name: Validate staged PNGs and forecast manifests
        shell: bash
        run: |
          root="$MPAS_OUT_DIR/site_export/runs/cams/rrfs_mpas/winter"
          if [[ -d "$root" ]] && find "$root" -name 'manifest_f*.json' -print -quit | grep -q .; then
            python scripts/publish_rrfs_mpas_winter.py --stage "$MPAS_OUT_DIR/site_export" --dry-run
          else
            echo 'No new forecast-hour manifests were produced.'
            echo "Expected output: $root"
            echo 'Diagnostic listing of winter output directories:'
            if [[ -d "$MPAS_OUT_DIR" ]]; then
              find "$MPAS_OUT_DIR" -maxdepth 6 -type f | head -60 || true
            else
              echo "MPAS_OUT_DIR does not exist: $MPAS_OUT_DIR"
            fi
            if [[ "${{ github.event_name }}" == 'workflow_dispatch' && "${{ inputs.publish }}" == 'false' ]]; then
              echo '::error::Dry-run produced no PNG manifests. Inspect the FTP inventory/render step above for why.'
              exit 1
            fi
            echo 'No unpublished forecast hours; skipping staging validation.'
          fi

      - name: Attach test plots and manifests (manual dry run only)
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.publish == false }}
        uses: actions/upload-artifact@v4
        with:
          name: rrfs-mpas-winter-hourly-preview
          path: ${{ github.workspace }}/rrfs_mpas_winter_output/site_export/runs/cams/rrfs_mpas/winter/
          if-no-files-found: warn
          retention-days: 2
